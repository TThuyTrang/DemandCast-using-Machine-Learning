[project]
name = "demandcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TThuyTrang", email = "truongthithuytrang140205@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.21.0",
    "ipykernel>=7.4.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
demandcast = "demandcast:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
